name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # WHY THESE EXIST. Until 2026-08-01 this job stood up nothing, and
    # FLOWX_POSTGRES_CONNECTION and FLOWX_REDIS_CONNECTION were unset — so every test
    # needing a real store skipped. Measured on the merged tree: **166 of 2180 skipped**,
    # and they are not an edge: they are the journal, the fenced lease, the recovery scan,
    # retention, the outbox publisher, the Redis lease store and stream publisher, the CLI's
    # journal reader and both conformance suites. The subsystem this project exists to
    # provide — durable execution against a real database — was verified by nobody on any
    # pull request, while the run reported green.
    #
    # That is the shape of defect this repository keeps finding: not a gate that fails, a
    # gate whose subject is absent. The suite could not go red over a broken journal,
    # because it never opened one.
    #
    # Copied from chaos.yml's block, which was written to be the one the others copy:
    # pinned major versions, a health check so the suite never races a server, and a
    # password because the tests connect over TCP.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.12
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      # The Service Bus emulator's own dependency. It is a service container rather than a
      # step so the emulator below can reach it by hostname on the job's network.
      sqledge:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Kafka runs from the Apache release rather than a container, because Docker Hub is not
      # reachable from every runner this repository is built on and the tarball is. KRaft mode,
      # so there is no ZooKeeper to stand up beside it.
      - name: Start Apache Kafka
        run: |
          curl -sS -O https://archive.apache.org/dist/kafka/4.1.2/kafka_2.13-4.1.2.tgz
          tar -xzf kafka_2.13-4.1.2.tgz
          cd kafka_2.13-4.1.2
          KAFKA_CLUSTER_ID=$(bin/kafka-storage.sh random-uuid)
          bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c config/server.properties --standalone
          nohup bin/kafka-server-start.sh config/server.properties > "$RUNNER_TEMP/kafka.log" 2>&1 &
          # The suite's own rule turns an unreachable broker into a failure rather than a skip, so
          # the wait is what stops that firing on a broker that was merely still starting.
          for _ in $(seq 1 30); do
            bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 && break
            sleep 2
          done
          bin/kafka-topics.sh --bootstrap-server localhost:9092 --list

      # The Service Bus emulator is started as a step rather than as a service container,
      # because it needs a topology file mounted from the repository and a service container
      # is created before the checkout exists. ADR-0074 is why the file exists at all: this
      # package creates no entities, so the ones the suite reads have to come from somewhere
      # a deployment would put them.
      #
      # Port 5673, so it does not collide with the RabbitMQ container on 5672.
      - name: Start the Service Bus emulator
        run: |
          docker run -d --name flowx-sbemulator \
            --add-host host.docker.internal:host-gateway \
            -p 5673:5672 \
            -v "$GITHUB_WORKSPACE/tests/FlowX.AzureServiceBus.Tests/emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            -e ACCEPT_EULA=Y \
            -e SQL_SERVER=host.docker.internal \
            -e MSSQL_SA_PASSWORD='Str0ng!Passw0rd' \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
          # It listens on 5672 inside the container and is published on 5673, because the
          # RabbitMQ service container already has 5672 on the host. SQL Edge is a service
          # container, so it is reached back across the bridge rather than by name.
          for _ in $(seq 1 30); do
            docker logs flowx-sbemulator 2>&1 | grep -q "Emulator Service is Successfully Up" && break
            sleep 5
          done
          docker logs flowx-sbemulator 2>&1 | tail -5

      - name: Restore
        run: dotnet restore FlowX.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors — a warning nobody fixes
        # is a warning that hides the next one.
        run: dotnet build FlowX.slnx --configuration Release --no-restore

      - name: Restore the projects that are not in the solution
        # This exists for exactly one gate, and it does not implement it.
        #
        # DependencyLicencesAreCompatible (constraint C6, ADR-0012) vets the *resolved*
        # transitive dependency graph, which NuGet writes to obj/project.assets.json —
        # so it needs no network and no licence API, but it does need a restore to have
        # happened. `dotnet restore FlowX.slnx` above covers every project in the
        # solution. scripts/generator-cost-probe is deliberately outside it (a
        # measurement harness, not a build target), so nothing restores it and its
        # closure would go unread. One line here, and CI vets it too.
        #
        # This is NOT a second implementation of the licence rule. There is one, it is
        # the fitness function, and this repository has already deleted a shell copy of
        # a rule that had a test — see the `debt` job in quality.yml and docs/DEBT.md:
        # two gates for one rule disagree eventually, and the weaker one is what a
        # developer meets first. This step widens the gate's input and decides nothing.
        #
        # templates/FlowX.Templates/content/FlowX.Web is deliberately absent: it
        # references FlowX.* packages by version, and until WP-70 publishes them there
        # is no feed to restore from. Its declared references are still checked, and
        # docs/DEPENDENCIES.md §5 records that its closure is not. Add it here when
        # WP-70 lands.
        run: dotnet restore scripts/generator-cost-probe/GeneratorCostProbe.csproj

      - name: Architecture fitness functions
        # docs/05-Architecture.md §12. A red fitness function is a build failure,
        # not a discussion — so this step runs before the rest of the suite.
        run: dotnet test tests/FlowX.Architecture.Tests --configuration Release --no-build --logger "console;verbosity=detailed"

      - name: Unit and integration tests
        id: tests
        # Both connection strings are set, which is what makes the services above worth
        # having. The suites' own three-way rule then does the rest of the work: unset
        # means skip with a reason, and **set with no server reachable means FAIL, never
        # skip** — so a service container that fails to start turns this job red instead of
        # quietly returning it to the 166-skip state it was in before.
        env:
          FLOWX_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
          FLOWX_REDIS_CONNECTION: "localhost:6379"
          FLOWX_RABBITMQ_CONNECTION: "amqp://guest:guest@localhost:5672/"
          FLOWX_SERVICEBUS_CONNECTION: "Endpoint=sb://localhost:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
          FLOWX_KAFKA_BOOTSTRAP: "localhost:9092"
        run: |
          # pipefail explicitly: the default shell takes the exit status of the LAST
          # command in a pipeline, so without it a failing test suite would be reported as
          # a passing step because tee succeeded. performance.yml's build-overhead job
          # carries the same line for the same reason.
          set -o pipefail
          dotnet test FlowX.slnx --configuration Release --no-build \
            --filter "FullyQualifiedName!~Architecture" \
            --collect:"XPlat Code Coverage" | tee /tmp/test-output.txt

      - name: No suite silently skipped its subject
        # The env vars above are one deletion away from being gone, and their absence is
        # invisible: the suite still passes, just over less. This asserts the thing that
        # would otherwise only be noticed by someone comparing test counts across runs.
        #
        # The threshold is deliberately loose. It is not "zero skips" — a suite is entitled
        # to skip a case for a reason of its own — it is "not the ~166 that mean no store
        # was reachable at all".
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          # Reads the run that already happened rather than running the suite a second
          # time — a guard that doubles the job's wall clock is a guard someone deletes.
          if [ ! -s /tmp/test-output.txt ]; then
            echo "::error::The test step produced no output to check."
            exit 1
          fi
          skipped=$(grep -oE 'Skipped:[[:space:]]+[0-9]+' /tmp/test-output.txt \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Skipped across the suite: $skipped"
          if [ "$skipped" -gt 20 ]; then
            echo "::error::$skipped tests skipped. Before 2026-08-01 that number was 166 and"
            echo "::error::it meant no PostgreSQL and no Redis were reachable, so the journal,"
            echo "::error::the lease, recovery, retention, the outbox and both conformance"
            echo "::error::suites were never exercised on any pull request. Check the service"
            echo "::error::containers and the two connection strings on the step above."
            exit 1
          fi

  template:
    name: dotnet new flowx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The template generates a project that builds clean and serves a request
        # templates/README.md called this "the acceptance test, and what CI should run",
        # and until now nothing ran it — so `dotnet new flowx` was verified by whoever
        # last remembered to, which is the definition of a gate that does not exist.
        #
        # Its own job, not a step in `build`, for two reasons. It is not about the
        # solution: the template pack is deliberately outside FlowX.slnx, and the thing
        # under test is `dotnet new`, `dotnet restore` against a feed, and a process
        # listening on a socket. And it is machine-global — it registers a NuGet source
        # and installs a template — which is fine on a throwaway runner and is not
        # something to do halfway through the test job.
        #
        # The script packs the seven packages a generated project resolves, evicting
        # them from the NuGet cache first: the version does not change between runs, and
        # NuGet caches by id AND version, so without the eviction a second run verifies
        # the first run's assemblies and reports green against stale output.
        run: templates/verify.sh

  aot:
    name: NativeAOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Trim and AOT analyzers must be clean
        # Constraint C2. For libraries the real gate is the analyzer, which
        # Directory.Build.props enables on everything under src/ via
        # IsAotCompatible. A reflection call that would break trimming surfaces
        # here as an IL2xxx/IL3xxx error at build time, not at publish time.
        run: |
          # pipefail, for the reason the test step in `build` spells out: without it the
          # step's exit status is tee's, so a build that FAILED reports a passing step and
          # the grep runs over a truncated log.
          set -o pipefail
          dotnet build FlowX.slnx --configuration Release 2>&1 | tee build.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}'  build.log; then
            echo "::error::Trim or AOT warnings found — constraint C2 forbids them."
            exit 1
          fi

      - name: NativeAOT publish
        # The reference sample is the executable that makes constraint C2 checkable:
        # PublishAot is a no-op on a class library, so until WP-10 this step had
        # nothing to publish and said so rather than passing vacuously.
        #
        # PublishAot is NOT passed with /p: here, and that is the whole point. A property
        # given on the command line is a *global* property: MSBuild passes it down into
        # every project this one references, including the two that are referenced as
        # analyzers — FlowX.Compiler and FlowX.Compiler.CodeFixes, both netstandard2.0,
        # because that is what Roslyn loads. netstandard2.0 cannot be AOT-compiled, so
        # each answered with NETSDK1207 and the publish produced no binary at all.
        #
        # samples/ecommerce/Ecommerce.csproj already sets <PublishAot>true</PublishAot> in
        # its own PropertyGroup, where it applies to that project and stops there. So this
        # is not a relaxation of constraint C2: the sample is still published ahead of
        # time, by the declaration that was always the right place for it. The command
        # line asking for it a second time is what broke it.
        run: |
          set -o pipefail
          dotnet publish samples/ecommerce/Ecommerce.csproj --configuration Release \
            --runtime linux-x64 --self-contained \
            /p:TrimmerSingleWarn=false 2>&1 | tee aot.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}' aot.log; then
            echo "::error::Trim or AOT warnings in the AOT publish."
            exit 1
          fi

          # The publish having "succeeded" is not the same fact as a binary existing, and
          # for days it was not the same fact here. Assert the artifact, so a publish that
          # emits nothing fails in the step that was supposed to produce it rather than in
          # the next one as a puzzling "did not become healthy".
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish/Ecommerce
          test -x "$BIN" || {
            echo "::error::The publish reported success but produced no native binary at $BIN."
            exit 1; }

      - name: The native binary serves a request
        # Publishing proves it links. This proves it runs: a trim-related failure that
        # the analyzer misses shows up at startup or on the first request, and a build
        # that only checks for IL warnings would report success anyway.
        run: |
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish/Ecommerce
          ASPNETCORE_URLS=http://127.0.0.1:5210 "$BIN" &
          APP=$!
          trap 'kill $APP 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5210/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:5210/health >/dev/null || {
            echo "::error::The native binary did not become healthy."; exit 1; }

          # A no-token request must be refused, and it is asserted FIRST because it is the
          # cheaper half of the same fact: authorisation is decided by the engine, from
          # validated claims, inside a natively-compiled binary. An AOT build that lost the
          # claims plumbing would answer 200 here and this step would otherwise applaud it.
          UNAUTH=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5210/api/v1/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-smoke-anon' \
            -d '{"sku":"SKU-1","quantity":1,"paymentToken":"tok"}')
          [ "$UNAUTH" = "403" ] || {
            echo "::error::An unauthenticated order got $UNAUTH, not 403. order.validate declares"
            echo "::error::Authorization.Authenticated and the engine must enforce it in the AOT build too."
            exit 1; }

          # And the positive case needs a caller who satisfies BOTH stances the flow
          # declares: order.validate wants any authenticated principal, payment.capture
          # wants the payment.write permission. Tokens.Cashier in samples/ecommerce is the
          # one demonstration token holding it; Tokens.Shopper deliberately does not, and
          # is refused at the third step after the inventory hold is compensated.
          BODY=$(curl -sf -X POST http://127.0.0.1:5210/api/v1/orders \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer cashier-token' \
            -H 'Idempotency-Key: ci-smoke' \
            -d '{"sku":"SKU-1","quantity":1,"paymentToken":"tok"}') || {
            echo "::error::The native binary refused a valid order."; exit 1; }

          echo "$BODY"
          echo "$BODY" | grep -q '"receiptId"' || {
            echo "::error::The response did not carry the flow's declared output."; exit 1; }

  manifest:
    name: Manifest compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The sample's manifest must stay compatible with its committed baseline
        # ADR-0005 makes the manifest a build artifact so it can be COMPARED. Until
        # something compares two of them the artifact is a description nobody acts on,
        # so this is the step that gives it teeth.
        #
        # The baseline is committed on purpose. A contract change then arrives as a
        # reviewable diff of samples/ecommerce/flowx.manifest.baseline.json rather than
        # as a number in a log, which is the same reasoning the benchmark baseline uses.
        # Regenerate it deliberately when the change is intended:
        #
        #   dotnet run --project src/FlowX.Cli -- manifest \
        #     --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
        #     --output samples/ecommerce/flowx.manifest.baseline.json
        run: |
          dotnet build samples/ecommerce/Ecommerce.csproj --configuration Release

          # The CLI has to be built before it can be run with --no-build, and nothing else
          # in this job builds it: it is deliberately not referenced by anything (see the
          # comment in FlowX.Cli.csproj — CliLinksNoFlowXAssembly asserts the absence), so
          # building the sample cannot drag it in. Without this line `dotnet run --no-build`
          # looked for bin/Release/net10.0/flowx, which is the right path — AssemblyName is
          # `flowx` — for a binary nothing had produced. The docs job already builds it this
          # way before running `flowx graph`.
          dotnet build src/FlowX.Cli --configuration Release

          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- manifest \
            --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
            --output "$RUNNER_TEMP/candidate.manifest.json"

          # No `if` and no wrapper: flowx diff exits 1 on a breaking change, and that
          # exit code is the gate.
          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- diff \
            --old samples/ecommerce/flowx.manifest.baseline.json \
            --new "$RUNNER_TEMP/candidate.manifest.json"

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # the flow-graph step below runs the CLI

      - name: Mermaid diagrams parse
        # 70+ diagrams. A diagram that does not render is a broken document, and GitHub
        # gives no error when one fails silently.
        #
        # This step used to report the whole truth as one line: "mermaid diagram failed to
        # parse". The file was passed as `file=` on the annotation, which the web UI shows
        # against the file and which does NOT appear in the log — so anyone reading the log,
        # which is what you get from the CLI, an API client or a notification, learned that
        # one of seventy-odd diagrams somewhere was broken and nothing else. Finding it meant
        # reinstalling mermaid-cli locally and bisecting by hand. The parser's own message,
        # which says the line and the token, was being sent to /dev/null.
        #
        # So: name the file and the diagram's index in the log body, print the diagram, and
        # print what mermaid actually said. The stack frames are dropped because they are
        # puppeteer's, never the document's.
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          fail=0
          while IFS= read -r file; do
            rm -f /tmp/block*.mmd
            python3 - "$file" <<'PY' > /tmp/blocks.txt
          import re, sys
          text = open(sys.argv[1]).read()
          for i, m in enumerate(re.finditer(r'```mermaid\n(.*?)```', text, re.S), 1):
              open(f'/tmp/block{i}.mmd', 'w').write(m.group(1))
              print(f'/tmp/block{i}.mmd')
          PY
            n=0
            while IFS= read -r block; do
              n=$((n + 1))
              if ! mmdc -i "$block" -o /tmp/out.svg -p /tmp/pptr.json > /tmp/mmdc.log 2>&1; then
                echo "::error file=$file::mermaid diagram #$n failed to parse"
                echo "=== $file: diagram #$n does not parse ==="
                sed 's/^/    /' "$block"
                echo "--- mermaid said ---"
                grep -vE '^\s+at ' /tmp/mmdc.log | sed 's/^/    /'
                echo "==="
                fail=1
              fi
            done < /tmp/blocks.txt
          # Every tracked markdown file, not `find docs samples`. A diagram in PLAN.md or in
          # a README outside those two trees renders on the same GitHub page as the rest and
          # was checked by nothing; `git ls-files` also cannot wander into node_modules or a
          # bin/ directory the way a bare `find` over the repository would.
          done < <(git ls-files '*.md')
          exit $fail

      - name: Rendered flow graph parses
        # WP-9's exit criterion. The renderer's unit tests check structure — every edge
        # references a declared node, every subgraph is closed — but only a real Mermaid
        # parser proves the file renders. A diagram that silently fails to render is the
        # failure mode a human eye skims past.
        run: |
          dotnet build src/FlowX.Cli --configuration Release
          dotnet run --configuration Release --project src/FlowX.Cli -- \
            graph --manifest tests/FlowX.Cli.Tests/fixtures/sample.manifest.json \
            --output /tmp/graph.mmd
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          mmdc -i /tmp/graph.mmd -o /tmp/graph.svg -p /tmp/pptr.json
          test -s /tmp/graph.svg || { echo "::error::mmdc produced no output."; exit 1; }

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import os, re, sys
          # The three infographics docs/assets/README.md declares are drawn by the
          # repository owner and are not in the tree. They were failing this job on
          # every run, which made a red docs gate the normal state and hid a real
          # break behind it. Named individually so a fourth missing asset still fails.
          absent = {
              'docs/assets/flowx-overview.png',
              'docs/assets/flowx-platform-map.png',
              'docs/assets/flowx-runtime-architecture.png',
          }
          bad = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', open(p).read()):
                      link = m.group(1)
                      if link.startswith(('http', '#', 'mailto')):
                          continue
                      target = link.split('#')[0]
                      if not target:
                          continue
                      resolved = os.path.normpath(os.path.join(root, target))
                      if os.path.relpath(resolved) in absent or os.path.exists(resolved):
                          continue
                      bad.append(f'{p} -> {link}')
          # An exemption outlives its reason silently. This one cannot.
          for a in sorted(absent):
              if os.path.exists(a):
                  bad.append(f'{a} exists — remove it from the exemption list in this job')
          for b in bad:
              print(f'::error::broken link {b}')
          sys.exit(1 if bad else 0)
          PY

  attribution:
    name: Attribution guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No bot authorship in history
        # Repository owner's standing requirement: commits are authored by people.
        #
        # Scoped to HEAD, not `--all`. `--all` was a live failure, not a hypothetical:
        # `fetch-depth: 0` pulls down every remote branch, including the open
        # `dependabot/*` pull-request branches this repository asks for in
        # .github/dependabot.yml — six of them today, each authored by `dependabot[bot]`
        # and so each matching the pattern below. The job therefore failed on every push
        # to dev and master for commits that are not part of this repository's history,
        # were not written by the author of the change under test, and could not be
        # remediated by them.
        #
        # This is a narrowing of blast radius, not of the rule: every commit that has
        # ever landed is still reachable from HEAD and still audited, and a bot-authored
        # commit inside the change under test is still caught. What is no longer audited
        # is somebody else's unmerged branch.
        run: |
          if git log HEAD --pretty=format:'%an|%ae|%cn|%ce' | grep -iE 'noreply@anthropic|\[bot\]'; then
            echo "::error::A commit is authored by a bot identity."
            exit 1
          fi
          echo "History is clean."

  red:
    name: A red run reaches a person
    # WHY THIS EXISTS. Five of the six jobs above were red on `dev` for days and nothing
    # happened, because nothing could: `dev` is not a protected branch, so a failing check
    # blocks no merge and no push, and no workflow here triggered on a failed run. The
    # whole consequence of a red build was a red icon on a page somebody had to think to
    # open. The suite passes locally, so the people best placed to notice were the least
    # likely to be shown.
    #
    # This repository has already written that finding down twice — CHECKLIST.md blocker
    # B-4 and the unnumbered package above WP-31 in PLAN.md — both about the `Benchmark
    # budgets` job, both concluding "blocking, and blocking nothing: no branch protection,
    # no notification". This is the same defect in a worse place: the job that builds the
    # product and runs the suite.
    #
    # chaos.yml already fixed this for the nightly QR2 run and its `issues: write` comment
    # names B-4 by number. This is that mechanism, for this workflow, deliberately the same
    # so there is one idea in the repository rather than two.
    needs: [build, template, aot, manifest, docs, attribution]

    # always(), or it would be skipped by exactly the failures it exists to report. Pushes
    # only: a red pull request is already in front of the person who opened it, and filing
    # an issue for one would be noise.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point. Without this the run can only be a red icon; with it, a failure
      # reaches a named person's notifications.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not interpolated into the shell line: a `${{ }}`
          # expansion inside a script is a script-injection shape whatever it holds today.
          FLOWX_NEEDS: ${{ toJSON(needs) }}
          # Same rule, and it was stated here while four expansions below broke it. A branch
          # name is the one an attacker can choose.
          FLOWX_BRANCH: ${{ github.ref_name }}
          FLOWX_COMMIT: ${{ github.sha }}
          FLOWX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLOWX_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/report-red-run.py \
            --branch "$FLOWX_BRANCH" \
            --commit "$FLOWX_COMMIT" \
            --run-url "$FLOWX_RUN_URL" \
            --owner "$FLOWX_OWNER" \
            --notify
